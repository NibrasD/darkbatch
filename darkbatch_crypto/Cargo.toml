[package]
name = "darkbatch_crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
pasta_curves = { version = "0.6", features = ["bits", "blake2b_simd"] }
group = "0.14"
ff = "0.14"
blake2b_simd = "1.0"
subtle = "2.6"
rand = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reddsa = "0.6"
chacha20poly1305 = "0.10"
rand_core = "0.10"
orchard = "0.16.0"

# Authoritative Zcash v6 / Ironwood transaction builder; do not hand-serialize consensus transactions.
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "9181ef851c7fa4100c28a7df6bcf1a5ff4c81dbd" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "9181ef851c7fa4100c28a7df6bcf1a5ff4c81dbd" }
sapling = { package = "sapling-crypto", version = "0.9.0" }


# Only used for the Sapling prover interface required by the generic transaction builder.
# This command builds Ironwood-only transactions; it never adds Sapling actions.
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "9181ef851c7fa4100c28a7df6bcf1a5ff4c81dbd", features = ["bundled-prover"] }
incrementalmerkletree = "0.9.0"
zcash_note_encryption = "0.5.1"
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "9181ef851c7fa4100c28a7df6bcf1a5ff4c81dbd" }
